            justify-content: center;

            font-weight: 900;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);

        .question-card {
            background: rgba(45, 21, 74, 0.8);

            border-radius: 20px;
            padding: 25px 20px;
            width: 100%;
            max-width: 450px;

            font-weight: 900;
            color: #fff;
            line-height: 1.4;
        }

        .options {

            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: linear-gradient(145deg, #3d1b63, #211033);
            border: 2px solid #7c3aed;
            border-radius: 15px;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #1e0a3c;
            font-family: 'Cairo', sans-serif;
        }
        .option-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1e0a3c; }

        .interaction-section {
            display: none;
            width: 100%;
            max-width: 450px;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.4s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }

        }

        .bot-box {

            border: 2px solid #22c55e;
            border-radius: 15px;
            padding: 20px;
            font-size: 17px;
