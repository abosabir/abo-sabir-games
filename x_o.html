<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة X O 🎮</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
        
        * { 
            box-sizing: border-box; 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: radial-gradient(circle at 50% 0%, #3b0764, #0d0416 70%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
            /* جلوگیری از اسکرول افقی */
            overflow-x: hidden; 
        }

        /* بخش بالا */
        .top-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(to bottom, #fbbf24, #b45309);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .status-container {
            min-height: 50px; /* ارتفاع حداقل برای جلوگیری از پریدن */
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .status {
            font-size: 18px;
            font-weight: bold;
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
            text-align: center;
            padding: 0 10px;
            line-height: 1.4;
        }

        /* منوی اصلی */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            margin-top: 20px;
        }

        .btn-menu {
            width: 100%;
            border-radius: 18px;
            padding: 15px 20px;
            font-size: 20px;
            font-weight: 900;
            color: white;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.2);
            transition: transform 0.1s;
        }
        .btn-menu:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }

        .btn-easy { background: linear-gradient(135deg, #10b981, #047857); border: 2px solid #34d399; }
        .btn-medium { background: linear-gradient(135deg, #f59e0b, #b45309); border: 2px solid #fbbf24; }
        .btn-hard { background: linear-gradient(135deg, #ef4444, #991b1b); border: 2px solid #f87171; }

        /* محیط بازی */
        .game-area {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* صفحه بازی - جادوی اصلی اینجاست */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 20px;
            border: 2px solid #7c3aed;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 0 15px rgba(124, 58, 237, 0.3);
            
            width: 100%;
            max-width: 320px; /* حداکثر عرض */
            aspect-ratio: 1 / 1; /* کل صفحه بازی همیشه مربع می‌مونه */
            
            margin-bottom: 30px;
        }

        .cell {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #3d1b63, #211033);
            border: 2px solid #6d28d9;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e0a3c;
            user-select: none;
            aspect-ratio: 1 / 1; /* هر خونه هم دقیقا مربع */
        }

        .cell.x { color: #60a5fa; text-shadow: 0 0 15px #3b82f6; }
        .cell.o { color: #ef4444; text-shadow: 0 0 15px #ef4444; }
        
        .cell.win {
            background: linear-gradient(145deg, #15803d, #064e3b);
            border-color: #22c55e;
            animation: pulseWin 0.5s infinite alternate;
        }
        @keyframes pulseWin {
            from { transform: scale(1); box-shadow: 0 0 10px #22c55e; }
            to { transform: scale(1.05); box-shadow: 0 0 20px #22c55e; }
        }

        /* دکمه‌های پایین */
        .bottom-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            width: 100%;
            max-width: 320px;
            min-height: 120px; /* جلوگیری از پریدن صفحه وقتی دکمه ظاهر میشه */
        }

        .btn-restart {
            background: linear-gradient(to bottom, #fbbf24, #d97706);
            border: 2px solid #fff;
            border-radius: 15px;
            padding: 12px;
            font-size: 18px;
            font-weight: 900;
            color: #000;
            cursor: pointer;
            box-shadow: 0 5px 0 #92400e;
            width: 100%;
            display: none;
        }
        .btn-restart:active { transform: translateY(3px); box-shadow: 0 2px 0 #92400e; }
        
        .btn-back {
            background: linear-gradient(to bottom, #334155, #1e293b);
            border: 2px solid #64748b;
            border-radius: 12px;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 0 #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-back:active { transform: translateY(3px); box-shadow: 0 1px 0 #0f172a; }
    </style>
</head>
<body>

    <!-- بخش بالا -->
    <div class="top-section">
        <div class="header-title">🕹️ X O</div>
        <div class="status-container">
            <div class="status" id="statusText"></div>
        </div>
    </div>
    
    <!-- منوی اصلی -->
    <div class="menu-container" id="mainMenu">
        <button class="btn-menu btn-easy" onclick="startGame('easy')">
            <span>مبتدئ</span><span>🌱</span>
        </button>
        <button class="btn-menu btn-medium" onclick="startGame('medium')">
            <span>محترف</span><span>🔥</span>
        </button>
        <button class="btn-menu btn-hard" onclick="startGame('hard')">
            <span>أسطورة</span><span>👑</span>
        </button>
    </div>

    <!-- محیط بازی -->
    <div class="game-area" id="gameArea">
        
        <!-- صفحه بازی -->
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <!-- دکمه‌های پایین -->
        <div class="bottom-actions">
            <button class="btn-restart" id="restartBtn" onclick="restartGame()">تحدي مجدد 🔥</button>
            <a href="index.html" class="btn-back">🔙 العودة للرئيسية</a>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('statusText');
        const cells = document.querySelectorAll('.cell');
        const restartBtn = document.getElementById('restartBtn');
        const mainMenu = document.getElementById('mainMenu');
        const gameArea = document.getElementById('gameArea');
        
        let boardState = ['', '', '', '', '', '', '', '', ''];
        let gameActive = false;
        let currentDifficulty = 'easy';
        const HUMAN = 'X'; 
        const BOT = 'O';   

        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], 
            [0, 3, 6], [1, 4, 7], [2, 5, 8], 
            [0, 4, 8], [2, 4, 6]             
        ];

        const botWinMessages = [
            "ههههه! هذا هو حقي! أنا الأفضل! 😎",
            "الحق معي دائماً! لا تحاول مجدداً! 🏆",
            "ألم أقل لك؟ أنا الأسطورة الحقيقية هنا! 👑",
            "حق عليك! تعلم اللعب أولاً ثم تحداني! 😂",
            "النصر حليفي! أنت مجرد مبتدئ! 🔥"
        ];

        const humanWinMessages = [
            "ههههه! هل فزت؟! لا أصدق! أنت تغش! 🤣",
            "ضربة حظ! 😂 لن تفوز مرة أخرى أبداً!",
            "هههههه! حتى الطفل يلعب أفضل منك! 🍼",
            "فزت؟! مستحيل! أنا كنت ألعب بيد واحدة! 😆",
            "لا تفرح! هذه مجرد صدفة! سأسحقك المرة القادمة! 🤬"
        ];

        const drawMessages = [
            "تعادل؟! مستحيل! أنا متأكد أنني أستطيع هزيمتك! تعال مرة أخرى! 💢",
            "هذه مجرد بداية! أنا أحميك الآن، المرة القادمة سأسحقك! 😈",
            "تعادل يعني أنك محظوظ! لكن الحظ لن يدوم! هيا مجدداً! 😤",
            "لا لا لا! هذا ليس فوزاً! أنا أستطيع هزيمتك بسهولة! أعد المحاولة! 🔥"
        ];

        function startGame(difficulty) {
            currentDifficulty = difficulty;
            mainMenu.style.display = 'none';
            gameArea.style.display = 'flex';
            resetBoard();
        }

        function restartGame() {
            resetBoard();
        }

        function resetBoard() {
            boardState = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            
            statusText.innerText = "دورك! (X)";
            statusText.style.color = "#fbbf24";
            
            restartBtn.style.display = 'none';
            
            cells.forEach(cell => {
                cell.innerText = '';
                cell.className = 'cell'; 
                cell.onclick = () => handleCellClick(cell);
            });
        }

        function handleCellClick(cell) {
            const index = parseInt(cell.getAttribute('data-index'));
            if (!gameActive || boardState[index] !== '') return;

            boardState[index] = HUMAN;
            cell.innerText = HUMAN;
            cell.classList.add('x');
            
            if (checkResult()) return;

            gameActive = false;
            setTimeout(botMove, 200); 
        }

        function botMove() {
            let moveIndex = -1;
            
            let aiChance = 0.6;
            if (currentDifficulty === 'medium') aiChance = 0.8;
            if (currentDifficulty === 'hard') aiChance = 0.9;
            
            let useAI = Math.random() < aiChance;

            if (useAI) {
                let bestScore = -Infinity;
                for (let i = 0; i < boardState.length; i++) {
                    if (boardState[i] === '') {
                        boardState[i] = BOT;
                        let score = minimax(boardState, 0, false);
                        boardState[i] = '';
                        if (score > bestScore) {
                            bestScore = score;
                            moveIndex = i;
                        }
                    }
                }
            } else {
                let emptyCells = [];
                boardState.forEach((val, i) => { if (val === '') emptyCells.push(i); });
                moveIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }

            boardState[moveIndex] = BOT;
            let botCell = document.querySelector(`.cell[data-index="${moveIndex}"]`);
            botCell.innerText = BOT;
            botCell.classList.add('o');

            if (checkResult()) return;

            gameActive = true;
        }

        function minimax(board, depth, isMaximizing) {
            let result = checkWinnerForMinimax(board);
            if (result !== null) {
                if (result === BOT) return 10 - depth;
                if (result === HUMAN) return depth - 10;
                if (result === 'draw') return 0;
            }

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < board.length; i++) {
                    if (board[i] === '') {
                        board[i] = BOT;
                        let score = minimax(board, depth + 1, false);
                        board[i] = '';
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < board.length; i++) {
                    if (board[i] === '') {
                        board[i] = HUMAN;
                        let score = minimax(board, depth + 1, true);
                        board[i] = '';
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function checkWinnerForMinimax(board) {
            for (let i = 0; i < winConditions.length; i++) {
                let [a, b, c] = winConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            if (!board.includes('')) return 'draw';
            return null;
        }

        function checkResult() {
            let roundWon = false;
            let winCombo = null;

            for (let i = 0; i < winConditions.length; i++) {
                let [a, b, c] = winConditions[i];
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    roundWon = true;
                    winCombo = [a, b, c];
                    break;
                }
            }

            if (roundWon) {
                gameActive = false;
                winCombo.forEach(idx => {
                    document.querySelector(`.cell[data-index="${idx}"]`).classList.add('win');
                });
                
                if (boardState[winCombo[0]] === HUMAN) {
                    statusText.innerText = humanWinMessages[Math.floor(Math.random() * humanWinMessages.length)];
                    statusText.style.color = "#22c55e";
                } else {
                    statusText.innerText = botWinMessages[Math.floor(Math.random() * botWinMessages.length)];
                    statusText.style.color = "#ef4444";
                }
                restartBtn.style.display = 'block';
                return true;
            }

            if (!boardState.includes('')) {
                gameActive = false;
                statusText.innerText = drawMessages[Math.floor(Math.random() * drawMessages.length)];
                statusText.style.color = "#fbbf24";
                restartBtn.style.display = 'block';
                return true;
            }

            return false;
        }
    </script>
</body>
    </html>
