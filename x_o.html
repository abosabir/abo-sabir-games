<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة X O 🎮</title>
    <!-- کتابخانه PeerJS برای بازی آنلاین بدون فیلترشکن -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at top, #2d154a, #0d0416);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .header-title {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(to bottom, #fbbf24, #b45309);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        /* منوی انتخاب حالت */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
        }
        .btn-menu {
            background: linear-gradient(to bottom, #7c3aed, #4c1d95);
            border: 2px solid #a855f7;
            border-radius: 15px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 #2e1065;
            transition: 0.2s;
        }
        .btn-menu:active { transform: translateY(4px); box-shadow: 0 1px 0 #2e1065; }
        .btn-menu:hover { background: #6d28d9; }

        /* بخش آنلاین */
        .online-box {
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 300px;
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #581c87;
            margin-bottom: 20px;
        }
        .online-box input {
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #7c3aed;
            background: #211033;
            color: white;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        .room-info { font-size: 14px; color: #fbbf24; text-align: center; margin: 5px 0; line-height: 1.5;}

        .status {
            font-size: 20px;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 20px;
            text-align: center;
            min-height: 30px;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 20px;
            border: 2px solid #581c87;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin-bottom: 30px;
            display: none; /* مخفی تا زمانی که بازی شروع شود */
        }

        .cell {
            width: 90px;
            height: 90px;
            background: linear-gradient(145deg, #3d1b63, #211033);
            border: 2px solid #7c3aed;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #1e0a3c;
            user-select: none;
        }
        
        .cell:hover { background: #4c1d95; border-color: #a855f7; }
        .cell:active { transform: translateY(4px); box-shadow: 0 1px 0 #1e0a3c; }

        .cell.x { color: #60a5fa; text-shadow: 0 0 15px #3b82f6; }
        .cell.o { color: #ef4444; text-shadow: 0 0 15px #ef4444; }

        .cell.win {
            background: linear-gradient(145deg, #15803d, #064e3b);
            border-color: #22c55e;
            animation: pulseWin 0.5s infinite alternate;
        }
        @keyframes pulseWin {
            from { transform: scale(1); box-shadow: 0 0 10px #22c55e; }
            to { transform: scale(1.05); box-shadow: 0 0 25px #22c55e; }
        }

        .btn-restart {
            background: linear-gradient(to bottom, #fbbf24, #d97706);
            border: 2px solid #fff;
            border-radius: 15px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            box-shadow: 0 5px 0 #92400e;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
            display: none;
        }
        .btn-restart:active { transform: translateY(4px); box-shadow: 0 1px 0 #92400e; }

        .btn-back {
            background: linear-gradient(to bottom, #ef4444, #b91c1c);
            border: 2px solid #fca5a5;
            border-radius: 10px;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 0 #7f1d1d;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .btn-back:active { transform: translateY(3px); box-shadow: 0 1px 0 #7f1d1d; }
    </style>
</head>
<body>

    <div class="header-title">X O 🎮</div>

    <!-- منوی اصلی -->
    <div class="menu-container" id="mainMenu">
        <button class="btn-menu" onclick="startGameMode('bot')">🤖 بازی با ربات</button>
        <button class="btn-menu" onclick="startGameMode('local')">👥 دو نفره (یک دستگاه)</button>
        <button class="btn-menu" onclick="showOnlineMenu()">🌐 دو نفره آنلاین</button>
    </div>

    <!-- بخش آنلاین -->
    <div class="online-box" id="onlineMenu">
        <button class="btn-menu" style="padding:10px; font-size:16px;" onclick="createRoom()">ساخت اتاق جدید</button>
        <input type="text" id="roomCodeInput" placeholder="کد اتاق را وارد کنید">
        <button class="btn-menu" style="padding:10px; font-size:16px;" onclick="joinRoom()">ورود به اتاق</button>
        <div class="room-info" id="roomInfo"></div>
        <button class="btn-back" style="justify-content:center; margin-top:10px;" onclick="goBackToMenu()">بازگشت</button>
    </div>

    <div class="status" id="statusText">اختر وضعية اللعب</div>

    <!-- صفحه بازی -->
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button class="btn-restart" id="restartBtn" onclick="resetBoard()">🔄 العب مرة أخرى</button>
    
    <a href="index.html" class="btn-back">🔙 العودة للرئيسية</a>

    <script>
        const statusText = document.getElementById('statusText');
        const cells = document.querySelectorAll('.cell');
        const restartBtn = document.getElementById('restartBtn');
        const mainMenu = document.getElementById('mainMenu');
        const onlineMenu = document.getElementById('onlineMenu');
        const boardDiv = document.getElementById('board');
        const roomInfo = document.getElementById('roomInfo');
        
        let boardState = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;
        
        // متغیرهای حالت بازی
        let currentMode = 'local'; // bot, local, online
        let currentPlayer = 'X';
        let botTimeout = null;

        // متغیرهای آنلاین (PeerJS)
        let peer = null;
        let conn = null;
        let mySymbol = 'X';
        let isOnline = false;
        let roomId = null;

        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], 
            [0, 3, 6], [1, 4, 7], [2, 5, 8], 
            [0, 4, 8], [2, 4, 6]             
        ];

        const botWinMessages = [
            "ههههه! فرت عليك! 😂 تلعب مثل الأطفال!",
            "الكمبيوتر دائماً يفوز! 😎 لا تحاول مجدداً!",
            "خسرت! 🏆 أنا الأسطورة الحقيقية هنا!"
        ];
        const humanWinMessages = [
            "😡 حسناً حسناً.. لقد فزت! بس المرة الجاية سأسحقك!",
            "أوه! 🥊 ضربة حظ.. دور آخر وسأريك من أنا!",
            "لا تفرح! 💢 هذه مجرد بداية، سأنتقم!"
        ];
        const drawMessages = [
            "🤝 تعادل! لكنني سأفوز في المرة القادمة!",
            "تعادل.. 🤨 أنت أفضل مما توقعت!",
            "لا فائز! 🎯 لكن المرة القادمة لن أرحمك!"
        ];

        // --- توابع منو ---
        function startGameMode(mode) {
            currentMode = mode;
            isOnline = false;
            mainMenu.style.display = 'none';
            onlineMenu.style.display = 'none';
            boardDiv.style.display = 'grid';
            resetBoard();
        }

        function showOnlineMenu() {
            mainMenu.style.display = 'none';
            onlineMenu.style.display = 'flex';
            statusText.innerText = "اختر إنشاء غرفة أو الانضمام إليها";
            boardDiv.style.display = 'none';
        }

        function goBackToMenu() {
            if (botTimeout) clearTimeout(botTimeout);
            if (conn) conn.close();
            if (peer) peer.destroy();
            
            mainMenu.style.display = 'flex';
            onlineMenu.style.display = 'none';
            boardDiv.style.display = 'none';
            restartBtn.style.display = 'none';
            roomInfo.innerText = "";
            document.getElementById('roomCodeInput').value = "";
            statusText.innerText = "اختر وضعية اللعب";
            isOnline = false;
        }

        // --- توابع اصلی بازی ---
        function resetBoard() {
            if (botTimeout) clearTimeout(botTimeout);
            boardState = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 'X';
            restartBtn.style.display = 'none';
            
            cells.forEach(cell => {
                cell.innerText = '';
                cell.className = 'cell'; 
            });

            if (currentMode === 'bot') {
                statusText.innerText = "دورك! اختر مربعاً (أنت X)";
                statusText.style.color = "#fbbf24";
            } else if (currentMode === 'local') {
                statusText.innerText = "دور اللاعب X";
                statusText.style.color = "#60a5fa";
            } else if (currentMode === 'online') {
                if (mySymbol === 'X') statusText.innerText = "أنت X - دورك";
                else statusText.innerText = "أنت O - انتظر دورك";
            }
        }

        function handleCellClick(cell) {
            const index = parseInt(cell.getAttribute('data-index'));
            
            if (!gameActive || boardState[index] !== '') return;

            if (currentMode === 'bot') {
                if (currentPlayer !== 'X') return; // در حالت ربات فقط X (کاربر) می‌تواند کلیک کند
                boardState[index] = 'X';
                cell.innerText = 'X';
                cell.classList.add('x');
                
                if (checkResult('X', index)) return;

                gameActive = false;
                statusText.innerText = "الكمبيوتر يفكر... 🤖";
                statusText.style.color = "#ef4444";
                setTimeout(botMove, 600);

            } else if (currentMode === 'local') {
                boardState[index] = currentPlayer;
                cell.innerText = currentPlayer;
                cell.classList.add(currentPlayer.toLowerCase());
                
                if (checkResult(currentPlayer, index)) return;

                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                statusText.innerText = `دور اللاعب ${currentPlayer}`;
                statusText.style.color = currentPlayer === 'X' ? "#60a5fa" : "#ef4444";

            } else if (currentMode === 'online') {
                if (currentPlayer !== mySymbol || !conn || !conn.open) return;
                
                boardState[index] = mySymbol;
                cell.innerText = mySymbol;
                cell.classList.add(mySymbol.toLowerCase());
                
                conn.send({ type: 'move', index: index, player: mySymbol });

                if (checkResult(mySymbol, index)) return;

                currentPlayer = mySymbol === 'X' ? 'O' : 'X';
                statusText.innerText = "انتظر دور الخصم...";
                statusText.style.color = "#fbbf24";
            }
        }

        // --- توابع ربات ---
        function botMove() {
            let moveIndex = -1;
            
            if (Math.random() < 0.7) {
                let bestScore = -Infinity;
                for (let i = 0; i < boardState.length; i++) {
                    if (boardState[i] === '') {
                        boardState[i] = 'O';
                        let score = minimax(boardState, 0, false);
                        boardState[i] = '';
                        if (score > bestScore) {
                            bestScore = score;
                            moveIndex = i;
                        }
                    }
                }
            } else {
                let emptyCells = [];
                boardState.forEach((val, i) => { if (val === '') emptyCells.push(i); });
                moveIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }

            boardState[moveIndex] = 'O';
            let botCell = document.querySelector(`.cell[data-index="${moveIndex}"]`);
            botCell.innerText = 'O';
            botCell.classList.add('o');

            if (checkResult('O', moveIndex)) return;

            gameActive = true;
            statusText.innerText = "دورك! اختر مربعاً (أنت X)";
            statusText.style.color = "#fbbf24";
        }

        function minimax(board, depth, isMaximizing) {
            let result = checkWinnerForMinimax(board);
            if (result !== null) {
                if (result === 'O') return 10 - depth;
                if (result === 'X') return depth - 10;
                if (result === 'draw') return 0;
            }

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < board.length; i++) {
                    if (board[i] === '') {
                        board[i] = 'O';
                        let score = minimax(board, depth + 1, false);
                        board[i] = '';
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < board.length; i++) {
                    if (board[i] === '') {
                        board[i] = 'X';
                        let score = minimax(board, depth + 1, true);
                        board[i] = '';
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function checkWinnerForMinimax(board) {
            for (let i = 0; i < winConditions.length; i++) {
                let [a, b, c] = winConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            if (!board.includes('')) return 'draw';
            return null;
        }

        // --- بررسی نتیجه بازی ---
        function checkResult(player, lastIndex) {
            let roundWon = false;
            let winCombo = null;

            for (let i = 0; i < winConditions.length; i++) {
                let [a, b, c] = winConditions[i];
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    roundWon = true;
                    winCombo = [a, b, c];
                    break;
                }
            }

            if (roundWon) {
                gameActive = false;
                winCombo.forEach(idx => {
                    document.querySelector(`.cell[data-index="${idx}"]`).classList.add('win');
                });
                
                if (currentMode === 'bot') {
                    if (player === 'X') {
                        statusText.innerText = humanWinMessages[Math.floor(Math.random() * humanWinMessages.length)];
                        statusText.style.color = "#22c55e";
                    } else {
                        statusText.innerText = botWinMessages[Math.floor(Math.random() * botWinMessages.length)];
                        statusText.style.color = "#ef4444";
                    }
                } else {
                    statusText.innerText = `اللاعب ${player} فاز! 🎉`;
                    statusText.style.color = "#22c55e";
                }
                
                if (currentMode !== 'online' || player === mySymbol) {
                    restartBtn.style.display = 'block';
                } else {
                    restartBtn.style.display = 'block'; // در آنلاین هر دو می‌بینند ولی فقط سازنده می‌تواند ریست کند (در ادامه مدیریت می‌شود)
                }
                return true;
            }

            if (!boardState.includes('')) {
                gameActive = false;
                statusText.innerText = drawMessages[Math.floor(Math.random() * drawMessages.length)];
                statusText.style.color = "#fbbf24";
                restartBtn.style.display = 'block';
                return true;
            }

            return false;
        }

        // --- توابع آنلاین (PeerJS) ---
        function createRoom() {
            roomId = "XO-" + Math.floor(1000 + Math.random() * 9000).toString();
            mySymbol = 'X';
            roomInfo.innerHTML = `كود الغرفة: <b style="color:#4ecdc4; font-size:1.2rem;">${roomId}</b><br>انتظر الخصم...`;
            
            peer = new Peer(roomId);
            
            peer.on('open', (id) => {
                currentMode = 'online';
                isOnline = true;
                onlineMenu.style.display = 'none';
                boardDiv.style.display = 'grid';
                resetBoard();
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });
        }

        function joinRoom() {
            const code = document.getElementById('roomCodeInput').value.trim();
            if (!code) return alert("أدخل كود الغرفة");

            roomId = code;
            mySymbol = 'O';
            
            peer = new Peer();
            
            peer.on('open', () => {
                conn = peer.connect(roomId);
                setupConnection();
                
                currentMode = 'online';
                isOnline = true;
                onlineMenu.style.display = 'none';
                boardDiv.style.display = 'grid';
                resetBoard();
            });

            peer.on('error', (err) => {
                alert("خطأ في الاتصال! تأكد من صحة الكود.");
                goBackToMenu();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                statusText.innerText = "تم الاتصال!";
                resetBoard();
            });

            conn.on
